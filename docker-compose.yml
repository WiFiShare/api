# A Postgres-backed deployment of the API, plus the two scheduled jobs the
# privacy rules require (P7 says both are enforced by a job, not by hand).
#
#   cp .env.example .env   # then fill in SECRET_KEY and OPTOUT_PEPPER
#   docker compose up --build
#
# Nothing here holds a secret: values come from .env, which is not committed.

name: wifishare-api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wifishare}
      POSTGRES_USER: ${POSTGRES_USER:-wifishare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wifishare}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wifishare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wifishare}
      BEHIND_TLS_PROXY: "on"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dump:/srv/dump
    restart: unless-stopped

  # Aggregation (P1-P6) and the export of the public dump.
  aggregate:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wifishare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wifishare}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dump:/srv/dump
    command: >
      sh -c 'while true; do
        python manage.py aggregate &&
        python manage.py export_dump --out /srv/dump;
        sleep 86400;
      done'
    restart: unless-stopped

  # Retention (P7). Hourly, so a 24-hour bucket never outlives its window by
  # more than an hour.
  purge:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wifishare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wifishare}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c 'while true; do python manage.py purge; sleep 3600; done'
    restart: unless-stopped

volumes:
  db-data:
  dump:
