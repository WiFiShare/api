[[package]]
name = "wifishare-api"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "cryptography" },
    { name = "django" },
    { name = "jsonschema" },
    { name = "pyhpke" },
]

[package.optional-dependencies]
postgres = [
    { name = "psycopg", extra = ["binary"] },
]
server = [
    { name = "gunicorn" },
]

[package.metadata]
requires-dist = [
    { name = "cryptography", specifier = ">=42" },
    { name = "django", specifier = ">=5.0,<6.0" },
    { name = "gunicorn", marker = "extra == 'server'", specifier = ">=22.0" },
    { name = "jsonschema", specifier = ">=4.21" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'postgres'", specifier = ">=3.1" },
    { name = "pyhpke", specifier = ">=0.6,<0.7" },
]
provides-extras = ["postgres", "server"]
